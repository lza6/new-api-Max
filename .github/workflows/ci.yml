name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      # B7-2 lint gate: gofmt violations fail the build. "changed files only"
      # baseline keeps legacy formatting drift out of scope while new code
      # is strictly gated.
      - name: gofmt check (changed files)
        run: |
          UNFORMATTED=$(gofmt -l . relaykit | grep -v "^web/" || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt violations:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # B7-2 lint gate: oxlint on changed frontend files only (legacy files
      # are out of scope; new/changed code is strictly gated).
      - name: Lint changed frontend files
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 2>/dev/null || git ls-files 'src/**/*.ts' 'src/**/*.tsx' | head -0)
          if [ -n "$CHANGED" ]; then
            bunx oxlint $CHANGED
          else
            echo "no changed frontend files, skip"
          fi

      - name: Typecheck
        run: bun run typecheck

      # §4.2.5 knip dead-code gate: fail only on NEW dead code (baseline diff
      # via scripts/knip-gate.mjs). The legacy 600+ backlog is intentionally
      # out of scope, so it never blocks CI.
      - name: Knip dead-code gate (no new dead code)
        run: node scripts/knip-gate.mjs

      # P0-1 gate hardening (v1.3.182). Before this, the i18n key-usage check was
      # never wired into CI and it cannot see a locale that is simply missing
      # translations: fr/ja/ru/vi were 95 keys short (zh-TW 66) while it printed
      # "OK (0 missing)" — the missing keys fell back to English at runtime.
      - name: i18n key usage gate
        run: node scripts/check-missing-i18n.cjs

      - name: i18n locale coverage gate
        run: node scripts/check-i18n-coverage.cjs

      # N1 terminology gate: one concept, one word. The script already existed
      # (bun run i18n:terminology) but was only ever run by hand, so "配额" had
      # crept back into 2 keys and nothing noticed.
      - name: i18n terminology gate
        run: node scripts/check-terminology.mjs

      # T-A5 version consistency: VERSION / CHANGELOG / tag / §0 / README must
      # agree. These drifted silently before (README still said v1.3.180 while
      # v1.3.181 was shipped). Dev mode tolerates "bumped but not yet tagged".
      - name: Version consistency gate
        working-directory: ${{ github.workspace }}
        run: node scripts/check-version-consistency.mjs

      # Design tokens (theme.css / theme-presets.css) must match the committed
      # snapshot; otherwise the parallel visual work (V1–V13) can drift silently.
      - name: Design token drift gate
        run: node scripts/ds-tokens-check.mjs

      - name: Test
        run: bun run test
  db-conformance:
    name: Three-database conformance (SQLite + MySQL + PostgreSQL)
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root@tcp(127.0.0.1:3306)/newapi_conformance_test?charset=utf8mb4&parseTime=true&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres@127.0.0.1:5432/newapi_conformance_test'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: newapi_conformance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: newapi_conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Wait for MySQL and PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent 2>/dev/null && pg_isready -U postgres -h 127.0.0.1 -q 2>/dev/null; then
              echo "both databases ready"
              exit 0
            fi
            sleep 2
          done
          echo "databases did not become ready in time"
          exit 1

      - name: Create conformance database (MySQL utf8mb4)
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS newapi_conformance_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run three-database conformance tests
        run: go test ./model/ -run "TestDBConformance" -v -count=1
