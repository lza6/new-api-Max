<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{margin:0;padding:0;background:#101c2b;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Microsoft YaHei",sans-serif}
  .wrap{width:min(96vw,1020px)}
  .cap{color:#dfe9f5;text-align:center;font-size:13px;letter-spacing:3px;opacity:.9;margin-bottom:10px}
  .stage{border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);background:#a8dcff}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">鹈鹕骑自行车 · 纯 SVG / SMIL 2D 动画</div>
  <div class="stage">
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车2D动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#55aef2"/>
        <stop offset=".55" stop-color="#a8dcff"/>
        <stop offset="1" stop-color="#eef9ff"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff6c8"/>
        <stop offset=".5" stop-color="#ffe28a" stop-opacity=".85"/>
        <stop offset="1" stop-color="#ffe28a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#96a49f"/>
        <stop offset="1" stop-color="#74817d"/>
      </linearGradient>
      <path id="hillFar" d="M0 440 C 160 400, 320 480, 480 440 C 640 400, 800 480, 960 440 L 960 600 L 0 600 Z" fill="#cdecc0" opacity="0.85"/>
      <path id="hillNear" d="M0 470 C 160 430, 320 510, 480 470 C 640 430, 800 510, 960 470 L 960 600 L 0 600 Z" fill="#a9d99a" opacity="0.9"/>
      <g id="bushRow">
        <g><circle cx="180" cy="486" r="14" fill="#8fcd75"/><circle cx="196" cy="488" r="11" fill="#83c069"/></g>
        <g><circle cx="520" cy="490" r="16" fill="#8fcd75"/><circle cx="540" cy="492" r="12" fill="#83c069"/></g>
        <g><circle cx="800" cy="484" r="13" fill="#8fcd75"/><circle cx="814" cy="486" r="10" fill="#83c069"/></g>
      </g>
      <g id="cloudShape">
        <ellipse cx="0" cy="0" rx="46" ry="20" fill="#ffffff" opacity=".95"/>
        <circle cx="-24" cy="-8" r="16" fill="#ffffff" opacity=".95"/>
        <circle cx="4" cy="-14" r="22" fill="#ffffff" opacity=".95"/>
        <circle cx="30" cy="-6" r="15" fill="#ffffff" opacity=".95"/>
      </g>
      <g id="wheel">
        <circle r="70" fill="none" stroke="#2b3036" stroke-width="10"/>
        <circle r="61.5" fill="none" stroke="#cdd5dd" stroke-width="3"/>
        <circle r="9" fill="#59616b" stroke="#33383f" stroke-width="2.5"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
          <g stroke="#b7c1cb" stroke-width="2.4" opacity=".9">
            <line x1="0" y1="-58" x2="0" y2="58"/>
            <line x1="-58" y1="0" x2="58" y2="0"/>
            <line x1="29" y1="-50.2" x2="-29" y2="50.2"/>
            <line x1="-29" y1="-50.2" x2="29" y2="50.2"/>
            <line x1="50.2" y1="-29" x2="-50.2" y2="29"/>
            <line x1="-50.2" y1="-29" x2="50.2" y2="29"/>
          </g>
        </g>
      </g>
      <path id="legShape" d="M0 0 L86 -32 L179 0" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="960" height="600" fill="url(#sky)"/>

    <!-- 太阳 + 光芒 -->
    <g>
      <circle cx="800" cy="110" r="78" fill="url(#sunGlow)"/>
      <circle cx="800" cy="110" r="34" fill="#ffe28a" stroke="#f8cf6b" stroke-width="3"/>
      <g opacity=".75">
        <animateTransform attributeName="transform" type="rotate" from="0 800 110" to="360 800 110" dur="40s" repeatCount="indefinite"/>
        <g stroke="#ffdf8f" stroke-width="5" stroke-linecap="round">
          <line x1="800" y1="30" x2="800" y2="52"/>
          <line x1="800" y1="168" x2="800" y2="190"/>
          <line x1="684" y1="110" x2="706" y2="110"/>
          <line x1="894" y1="110" x2="916" y2="110"/>
          <line x1="718" y1="28" x2="733" y2="43"/>
          <line x1="867" y1="177" x2="882" y2="192"/>
          <line x1="882" y1="28" x2="867" y2="43"/>
          <line x1="733" y1="177" x2="718" y2="192"/>
        </g>
      </g>
    </g>

    <!-- 远山 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="90s" repeatCount="indefinite"/>
      <use href="#hillFar"/><use href="#hillFar" x="960"/>
    </g>

    <!-- 云朵 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-320 0" to="1320 0" dur="95s" repeatCount="indefinite"/>
      <use href="#cloudShape" x="120" y="96"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-420 0" to="1320 0" dur="125s" repeatCount="indefinite"/>
      <use href="#cloudShape" x="520" y="60" transform="scale(0.75)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-240 0" to="1320 0" dur="150s" repeatCount="indefinite"/>
      <use href="#cloudShape" x="760" y="170" transform="scale(0.6)"/>
    </g>

    <!-- 近山 + 灌木 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="60s" repeatCount="indefinite"/>
      <use href="#hillNear"/><use href="#hillNear" x="960"/>
      <use href="#bushRow"/><use href="#bushRow" x="960"/>
    </g>

    <!-- 路面 -->
    <rect x="0" y="500" width="960" height="100" fill="url(#road)"/>
    <rect x="0" y="495" width="960" height="6" fill="#8fce72"/>
    <line x1="0" y1="545" x2="960" y2="545" stroke="#fdf3cd" stroke-width="6" stroke-dasharray="70 50">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.09s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="515" x2="960" y2="515" stroke="#f4f7f6" stroke-width="3" opacity=".55"/>
    <line x1="0" y1="585" x2="960" y2="585" stroke="#f4f7f6" stroke-width="3" opacity=".55"/>

    <!-- 车身影子 -->
    <ellipse cx="480" cy="548" rx="215" ry="10" fill="#000000" opacity=".13"/>

    <!-- ============ 远处腿（在车轮后面） ============ -->
    <g transform="translate(430 330)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="80.981;78.104;75.702;73.972;72.992;72.748;73.163;74.134;75.551;77.304;79.292;81.418;83.589;85.715;87.703;89.457;90.874;91.845;92.261;92.016;91.037;89.307;86.906;84.029;80.981" keyTimes="0.000;0.042;0.083;0.125;0.167;0.208;0.250;0.292;0.333;0.375;0.417;0.458;0.500;0.542;0.583;0.625;0.667;0.708;0.750;0.792;0.833;0.875;0.917;0.958;1.000" dur="4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="0.712 1;0.724 1;0.746 1;0.776 1;0.812 1;0.849 1;0.887 1;0.921 1;0.951 1;0.975 1;0.992 1;1.000 1;1.000 1;0.992 1;0.975 1;0.951 1;0.921 1;0.887 1;0.849 1;0.812 1;0.776 1;0.746 1;0.724 1;0.712 1;0.712 1" keyTimes="0.000;0.042;0.083;0.125;0.167;0.208;0.250;0.292;0.333;0.375;0.417;0.458;0.500;0.542;0.583;0.625;0.667;0.708;0.750;0.792;0.833;0.875;0.917;0.958;1.000" dur="4s" repeatCount="indefinite"/>
          <use href="#legShape" stroke="#d98a34"/>
          <circle cx="86" cy="-32" r="5.5" fill="#efb058"/>
          <circle cx="179" cy="0" r="6" fill="#d98a34"/>
        </g>
      </g>
    </g>

    <!-- ============ 远侧曲柄/踏板/脚（车轮后面） ============ -->
    <g transform="translate(450 482)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <g transform="rotate(180)">
        <rect x="-3.5" y="0" width="7" height="26" rx="3" fill="#565b62"/>
        <g transform="translate(0 26)">
          <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#3f444b"/>
          <path d="M -8 -3 L 0 -7 L 8 -8 L 12 -5 L 8 -2 L 14 -1 L 18 2 L 13 4 L 5 4 L -4 4 L -9 2 Z" fill="#cf7f2a" stroke="#a05a15" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- ============ 自行车 ============ -->
    <g id="bike">
      <use href="#wheel" x="260" y="475"/>
      <use href="#wheel" x="700" y="475"/>
      <g fill="none" stroke="#d8402f" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M425 345 L450 482"/>
        <path d="M672 380 L450 482"/>
        <path d="M425 345 L645 340"/>
        <path d="M450 482 L260 475"/>
        <path d="M425 345 L260 475"/>
        <path d="M672 380 L700 475"/>
        <path d="M645 340 L672 380" stroke-width="12"/>
        <path d="M425 345 L420 332"/>
        <path d="M645 340 L682 312"/>
        <path d="M682 312 Q 694 306 704 312"/>
      </g>
      <path d="M205 420 A 78 78 0 0 1 315 420" fill="none" stroke="#d8402f" stroke-width="6" opacity=".85"/>
      <path d="M645 420 A 78 78 0 0 1 755 420" fill="none" stroke="#d8402f" stroke-width="6" opacity=".85"/>
      <rect x="398" y="320" width="46" height="9" rx="4.5" fill="#33383f"/>
      <rect x="697" y="305" width="16" height="10" rx="5" fill="#2a2f36"/>
      <circle cx="260" cy="475" r="11" fill="#c3cbd2" stroke="#8f98a0" stroke-width="2"/>
      <path d="M260 464 L450 464 M450 500 L260 486" stroke="#5c656d" stroke-width="3.5" stroke-dasharray="7 5.6">
        <animate attributeName="stroke-dashoffset" from="0" to="-113.4" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="450" cy="482" r="18" fill="#e9e9e9" stroke="#9aa3ab" stroke-width="2.5"/>
      <circle cx="450" cy="482" r="6" fill="#c3cbd2" stroke="#8f98a0" stroke-width="1.5"/>
    </g>

    <!-- ============ 近侧曲柄/踏板/脚（车架前面） ============ -->
    <g transform="translate(450 482)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <g transform="rotate(0)">
        <rect x="-3.5" y="0" width="7" height="26" rx="3" fill="#6b6f75"/>
        <g transform="translate(0 26)">
          <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#4a4e54"/>
          <path d="M -8 -3 L 0 -7 L 8 -8 L 12 -5 L 8 -2 L 14 -1 L 18 2 L 13 4 L 5 4 L -4 4 L -9 2 Z" fill="#f5a03e" stroke="#c97a1c" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- ============ 近侧腿（车架前面） ============ -->
    <g transform="translate(430 330)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="83.589;85.715;87.703;89.457;90.874;91.845;92.261;92.016;91.037;89.307;86.906;84.029;80.981;78.104;75.702;73.972;72.992;72.748;73.163;74.134;75.551;77.304;79.292;81.418;83.589" keyTimes="0.000;0.042;0.083;0.125;0.167;0.208;0.250;0.292;0.333;0.375;0.417;0.458;0.500;0.542;0.583;0.625;0.667;0.708;0.750;0.792;0.833;0.875;0.917;0.958;1.000" dur="4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1.000 1;0.992 1;0.975 1;0.951 1;0.921 1;0.887 1;0.849 1;0.812 1;0.776 1;0.746 1;0.724 1;0.712 1;0.712 1;0.724 1;0.746 1;0.776 1;0.812 1;0.849 1;0.887 1;0.921 1;0.951 1;0.975 1;0.992 1;1.000 1;1.000 1" keyTimes="0.000;0.042;0.083;0.125;0.167;0.208;0.250;0.292;0.333;0.375;0.417;0.458;0.500;0.542;0.583;0.625;0.667;0.708;0.750;0.792;0.833;0.875;0.917;0.958;1.000" dur="4s" repeatCount="indefinite"/>
          <use href="#legShape" stroke="#f0a94a"/>
          <circle cx="86" cy="-32" r="5.5" fill="#f6c069"/>
          <circle cx="179" cy="0" r="6" fill="#f0a94a"/>
        </g>
      </g>
    </g>

    <!-- ============ 鹈鹕身体（以髋部为锚点，上下颠簸） ============ -->
    <g transform="translate(430 330)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 3;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;-2.4;0;2.2;0" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>

          <!-- 尾巴 -->
          <path d="M 25 -20 C -12 -28 -30 -42 -36 -56 C -22 -46 -6 -40 10 -38 C -6 -50 -16 -60 -18 -72 C -2 -60 12 -48 24 -38 Z" fill="#dfe7ee" stroke="#c2cdd8" stroke-width="2" stroke-linejoin="round"/>
          <!-- 远侧翅膀 -->
          <g transform="translate(60 -50)"><path d="M 0 0 C -30 -30 -72 -26 -86 -4 C -94 10 -84 22 -56 20 C -32 18 -8 10 0 0 Z" fill="#e7edf4" stroke="#ccd6e0" stroke-width="2"/></g>
          <!-- 身体 -->
          <ellipse cx="80" cy="-38" rx="60" ry="52" fill="#fdfdfd" stroke="#d5dde5" stroke-width="3" transform="rotate(-12 80 -38)"/>
          <!-- 腹部阴影 -->
          <ellipse cx="88" cy="-26" rx="40" ry="34" fill="#eef3f8" opacity=".75" transform="rotate(-12 88 -26)"/>

          <!-- 近侧翅膀（扇动） -->
          <g transform="translate(60 -50)">
            <animateTransform attributeName="transform" type="rotate" values="-8;16;-8" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
            <path d="M 0 0 C -8 -36 -32 -60 -60 -60 C -82 -60 -98 -44 -102 -26 C -106 -10 -94 2 -72 4 C -46 6 -16 -6 0 0 Z" fill="#f6f9fc" stroke="#d5dde5" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M -44 -50 L -58 -58 L -52 -42 Z M -66 -44 L -80 -52 L -72 -36 Z M -86 -34 L -98 -40 L -90 -26 Z" fill="#cfd9e2"/>
          </g>

          <!-- 脖子 -->
          <path d="M 120 -60 C 140 -98 158 -116 186 -122" fill="none" stroke="#fdfdfd" stroke-width="30" stroke-linecap="round"/>
          <path d="M 120 -60 C 140 -98 158 -116 186 -122" fill="none" stroke="#f2f6fa" stroke-width="20" stroke-linecap="round"/>

          <!-- 头部（轻微点头） -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 200 -118;-3 200 -118;0 200 -118;2.5 200 -118;0 200 -118" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
            <circle cx="200" cy="-118" r="21" fill="#fdfdfd" stroke="#d5dde5" stroke-width="2.5"/>
            <g stroke="#dfe7ee" stroke-width="4" stroke-linecap="round">
              <path d="M 192 -138 Q 188 -148 184 -155"/>
              <path d="M 200 -139 Q 199 -150 198 -157"/>
              <path d="M 208 -136 Q 210 -146 212 -152"/>
            </g>
            <!-- 上喙 -->
            <path d="M 214 -126 L 300 -116 Q 308 -115 309 -109 L 306 -103 L 216 -117 Z" fill="#f6b73c" stroke="#d99327" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 214 -118 L 298 -105" stroke="#d99327" stroke-width="2" opacity=".55"/>
            <!-- 喉囊（会轻轻鼓动） -->
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1 214 -112;1.06 1.05 214 -112;1 1 214 -112" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite"/>
              <path d="M 214 -116 C 250 -108 286 -104 302 -104 C 292 -62 256 -46 230 -62 C 216 -72 212 -94 214 -116 Z" fill="#f2a04c" opacity=".93" stroke="#d9802b" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <!-- 眼睛 -->
            <circle cx="207" cy="-125" r="4.2" fill="#26303a"/>
            <circle cx="208.6" cy="-126.6" r="1.3" fill="#ffffff"/>
            <path d="M 196 -112 Q 200 -109 204 -111" stroke="#f3b4a0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 前鳍（搭到车把上） -->
          <path d="M 60 -50 C 130 -40 200 -28 264 -20" fill="none" stroke="#fdfdfd" stroke-width="15" stroke-linecap="round"/>
          <path d="M 60 -50 C 130 -40 200 -28 264 -20" fill="none" stroke="#e6edf4" stroke-width="7" stroke-linecap="round" opacity=".8"/>
          <ellipse cx="266" cy="-18" rx="7" ry="6" fill="#dfe7ee" stroke="#c2cdd8" stroke-width="1.5"/>
        </g>
      </g>
    </g>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".35">
      <line x1="900" y1="250" x2="840" y2="250">
        <animate attributeName="x1" values="900;700" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="840;640" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.5;0" keyTimes="0;.5;1" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="920" y1="300" x2="870" y2="300">
        <animate attributeName="x1" values="920;700" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="870;650" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.5;0" keyTimes="0;.5;1" dur="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="24" y="585" font-size="15" fill="#ffffff" opacity=".85" font-family="system-ui,'Microsoft YaHei',sans-serif">鹈鹕骑行中 🚲 咕噜咕噜…</text>
  </svg>
  </div>
</div>
</body>
</html>
