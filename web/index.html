<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <!-- 默认英文；中文站点由运行时（system_name / 语言）覆写 <title> 与 meta[name=title]。 -->
    <title>New API Max — One Endpoint for Every AI Model</title>
    <meta name="title" content="New API Max — One Endpoint for Every AI Model" />
    <meta
      name="description"
      content="Unified AI API gateway for OpenAI, Claude, Gemini & 40+ providers. Transparent pay-as-you-go pricing, drop-in OpenAI-compatible API, plug-and-play desktop clients."
    />
    <meta
      name="keywords"
      content="AI API gateway, 大模型 API, unified AI API, OpenAI compatible API, Claude API, Gemini API, DeepSeek API"
    />
    <link rel="canonical" href="/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="New API Max — One Endpoint for Every AI Model" />
    <meta
      property="og:description"
      content="Unified AI API gateway for 40+ model providers with transparent pay-as-you-go pricing."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="New API Max — One Endpoint for Every AI Model" />
    <meta
      name="twitter:description"
      content="Unified AI API gateway for 40+ model providers with transparent pay-as-you-go pricing."
    />

    <!-- Structured data: SoftwareApplication (产品站) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "New API Max",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Unified AI API gateway for OpenAI, Claude, Gemini and 40+ model providers with transparent pay-as-you-go pricing.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!--umami-->
    <!--Google Analytics-->

    <!-- Warm the Google Analytics connection without loading the script. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <!-- Initial loader: shown until React mounts (main.tsx awaits i18n locale load).
           React replaces #root content on first render, so this disappears automatically. -->
      <div id="app-boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="width:28px;height:28px;border:3px solid rgba(128,128,128,.25);border-top-color:#5b9dff;border-radius:50%;animation:app-boot-spin .8s linear infinite"></div>
      </div>
      <style>@keyframes app-boot-spin{to{transform:rotate(360deg)}}</style>
    </div>
  </body>
</html>
